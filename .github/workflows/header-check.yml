name: Header check

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate-headers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate repo-owned file headers
        run: python scripts/check_headers.py
